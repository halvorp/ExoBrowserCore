[package]
name = "gutted-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable 100% Pure-Rust #![no_std] + alloc browser client library and standalone application (zero C dependencies)."

[lib]
name = "gutted_client"
path = "src/lib.rs"

[[bin]]
name = "gutted-client"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["gutted-proto/std", "ttf", "dep:x11rb"]
ttf = ["dep:ab_glyph"]

[dependencies]
gutted-proto = { path = "../gutted-proto", default-features = false }
ab_glyph = { version = "0.2", default-features = false, features = ["libm"], optional = true }

[target.'cfg(all(unix, not(target_os = "redox")))'.dependencies]
x11rb = { version = "0.13", default-features = false, optional = true }
